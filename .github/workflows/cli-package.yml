name: CLI package validation

on:
  pull_request:
    paths:
      - 'apps/cli/**'
      - 'libs/**'
      - 'tools/cli-release/**'
      - 'nx.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup-workspace/**'
      - '.github/workflows/cli-package.yml'
  push:
    branches:
      - main
      - development
    paths:
      - 'apps/cli/**'
      - 'libs/**'
      - 'tools/cli-release/**'
      - 'nx.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup-workspace/**'
      - '.github/workflows/cli-package.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cli-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest'
        # Re-enabled by the pnpm 11 upgrade (issue #352): pnpm >=11 talks to
        # npm's bulk advisory endpoint instead of the retired legacy audit
        # endpoint that returned 410 Gone (pnpm/pnpm#11268).
        run: pnpm audit --prod --audit-level high

      - name: Test CLI release-critical paths
        shell: bash
        run: bash tools/cli-release/preflight-tests.sh

      - name: Build, validate, and smoke install package
        run: pnpm nx run cli:smoke-install

      - name: Generate SBOM
        if: matrix.os == 'ubuntu-latest'
        run: npx --yes @cyclonedx/cdxgen --required-only -t js -o dist/apps/cli/cli-sbom.cyclonedx.json

      - name: Upload package validation artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-package-validation
          path: |
            dist/apps/cli/package-validation.json
            dist/apps/cli/package-smoke.json
            dist/apps/cli/cli-sbom.cyclonedx.json
