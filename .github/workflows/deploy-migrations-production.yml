name: Deploy Supabase migrations (production)

# Applies pending supabase/migrations/**  to the production Supabase project
# whenever they land on main. Gated by the `production` GitHub Environment —
# configure a required reviewer there (Settings → Environments → production)
# so this pauses for a maintainer's approval before supabase db push runs
# against real user data. Until that environment protection rule exists,
# this job will run unattended the moment it appears on main.
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN   — personal/CI access token (supabase.com/dashboard/account/tokens)
#   PROD_SUPABASE_PROJECT_REF — production project ref (Settings → General → Reference ID)
#   PROD_SUPABASE_DB_PASSWORD — production database password

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be applied without changing the database'
        type: boolean
        default: true

concurrency:
  group: deploy-migrations-production
  cancel-in-progress: false

jobs:
  deploy:
    name: supabase db push
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          install: 'false'

      # Pinned: Supabase CLI 3.x rejects the [inbucket] section in supabase/config.toml,
      # which stopped this workflow before it reached the database.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.78.1
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The direct db.<ref>.supabase.co host is IPv6-only and GitHub-hosted runners have no IPv6,
      # so connect through the project's Supavisor pooler in session mode (IPv4, port 5432).
      - name: Build database connection string
        id: db
        run: |
          set -euo pipefail
          POOLER=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROD_SUPABASE_PROJECT_REF/config/database/pooler")
          HOST=$(echo "$POOLER" | jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_host // .[0].db_host')
          USER=$(echo "$POOLER" | jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_user // .[0].db_user')
          if [ -z "$HOST" ] || [ "$HOST" = "null" ]; then echo "Could not read the pooler host" >&2; exit 1; fi
          ENCODED_PASSWORD=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PROD_SUPABASE_DB_PASSWORD")
          echo "::add-mask::$ENCODED_PASSWORD"
          echo "url=postgresql://${USER}:${ENCODED_PASSWORD}@${HOST}:5432/postgres" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
          PROD_SUPABASE_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}

      # supabase link fails today with a SchemaError from the Management API's
      # "get api keys" response (unrelated to this workflow's migrations).
      # Connecting straight via --db-url skips that call entirely.
      - name: Show pending migrations
        run: supabase migration list --db-url "${{ steps.db.outputs.url }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Dry run (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: supabase db push --db-url "${{ steps.db.outputs.url }}" --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: supabase db push --db-url "${{ steps.db.outputs.url }}" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Confirm migration history
        if: always()
        run: supabase migration list --db-url "${{ steps.db.outputs.url }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
