name: Deploy Supabase migrations (production)

# Applies pending supabase/migrations/**  to the production Supabase project
# whenever they land on main. Gated by the `production` GitHub Environment —
# configure a required reviewer there (Settings → Environments → production)
# so this pauses for a maintainer's approval before supabase db push runs
# against real user data. Until that environment protection rule exists,
# this job will run unattended the moment it appears on main.
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN   — personal/CI access token (supabase.com/dashboard/account/tokens)
#   PROD_SUPABASE_PROJECT_REF — production project ref (Settings → General → Reference ID)
#   PROD_SUPABASE_DB_PASSWORD — production database password

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-migrations-production
  cancel-in-progress: false

jobs:
  deploy:
    name: supabase db push
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          install: 'false'

      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build database connection string
        id: db
        run: |
          ENCODED_PASSWORD=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PROD_SUPABASE_DB_PASSWORD")
          echo "::add-mask::$ENCODED_PASSWORD"
          echo "url=postgresql://postgres:${ENCODED_PASSWORD}@db.${PROD_SUPABASE_PROJECT_REF}.supabase.co:5432/postgres" >> "$GITHUB_OUTPUT"
        env:
          PROD_SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
          PROD_SUPABASE_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}

      # supabase link fails today with a SchemaError from the Management API's
      # "get api keys" response (unrelated to this workflow's migrations).
      # Connecting straight via --db-url skips that call entirely.
      - name: Show pending migrations
        run: supabase migration list --db-url "${{ steps.db.outputs.url }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations
        run: supabase db push --db-url "${{ steps.db.outputs.url }}" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Confirm migration history
        if: always()
        run: supabase migration list --db-url "${{ steps.db.outputs.url }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
