name: Docs link check

# Runs on PRs that touch any markdown under docs/. Fails if a link is dead
# (excluding localhost and private hosts — see .markdown-link-check.json).

on:
  pull_request:
    paths:
      - 'docs/**/*.md'
      - '.markdown-link-check.json'
      - '.github/workflows/docs-link-check.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find changed markdown files
        id: changed
        uses: tj-actions/changed-files@2d756ea4c53f7f6b397767d8723b3a10a9f35bf2 # v44
        with:
          files: docs/**/*.md

      - name: Run markdown-link-check on changed files
        if: steps.changed.outputs.any_changed == 'true'
        shell: bash
        # Runs the underlying tool directly on exactly the changed docs/**/*.md
        # files (from the step above), rather than the gaurav-nelson wrapper
        # action's own folder/diff-based discovery — that scans its whole
        # folder-path against base-branch regardless of file-path, which
        # picks up every file under vendor/opencode (a vendored third-party
        # tree, not something this check should touch).
        run: |
          npm install --global markdown-link-check@3.13.7
          for file in ${{ steps.changed.outputs.all_changed_files }}; do
            echo "::group::$file"
            markdown-link-check --config .markdown-link-check.json --quiet "$file"
            echo "::endgroup::"
          done
