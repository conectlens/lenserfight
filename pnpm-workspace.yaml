# pnpm settings.
#
# As of pnpm 10 the `pnpm` field in package.json is no longer read — pnpm 11
# warns "The following keys were ignored" and silently drops them. The
# overrides below are security floors, so losing them would be a silent
# regression; they live here instead.
#
# `packages` is intentionally omitted: this repo keeps every dependency in the
# root manifest, so omitting it leaves the workspace as root-only and keeps
# resolution identical to the pre-upgrade layout.

# pnpm 10 stopped running dependency build scripts unless they are listed here.
# pnpm 9 ran all of them, so every package pnpm flagged is allowed, keeping the
# upgrade behaviour-preserving. Tightening this list is a deliberate
# supply-chain decision and belongs in its own change, not in a version bump.
allowBuilds:
  '@swc/core': true # native SWC binary — Jest/Nx transforms fail without it
  '@tsparticles/engine': true
  core-js: true
  detox: true # native mobile e2e harness (apps/mobile)
  dtrace-provider: true
  esbuild: true # downloads the platform binary; builds break without it
  node-pty: true
  nx: true # native Nx bindings
  protobufjs: true
  sharp: true # native libvips binary — used by scripts/generate-hero-preview.mjs to encode animated WebP
  unrs-resolver: true # native resolver used by the eslint import plugin

# Security floors. Several of these had drifted below their advisory's patched
# version while `pnpm audit` was disabled — with no audit running, nothing
# caught it. They are raised here so the re-enabled `--audit-level high` gate
# passes; ranges stay bounded to the current major so a floor never becomes a
# silent major upgrade.
overrides:
  protobufjs: '>=7.5.6'
  minimatch: '>=9.0.7'
  '@xmldom/xmldom': '>=0.9.12 <0.10'
  axios: '>=1.18.0'
  tmp: '>=0.2.7'
  handlebars: '>=4.7.9'
  flatted: '>=3.4.2'
  koa: '>=3.2.1'
  fast-uri: '>=4.1.3 <5'
  browserslist: '>=4.28.7 <5'
  lodash: '>=4.18.1'
  lodash-es: '>=4.18.1'
  '@babel/plugin-transform-modules-systemjs': '>=7.29.7'
  postcss: '>=8.5.18'
  uuid: '>=9.0.1'
  esbuild: '>=0.25.0'
  shell-quote: '>=1.8.5'
  ws: '>=8.21.0'
  form-data: '>=4.0.6'
  hono: '>=4.12.25'
  vite: '>=7.3.5'
  undici: '>=7.29.0 <8'
  tar: '>=7.5.19'
  ip-address: '>=10.3.1'
  svgo: '>=4.1.0 <5'
  # Two independent major lines are present in the tree, each with its own
  # advisory, so these are scoped rather than collapsed onto one version.
  'brace-expansion@^2.0.0': '>=2.1.3 <3'
  'brace-expansion@^5.0.0': '>=5.0.8 <6'
  'js-yaml@^3.0.0': '>=3.15.2 <4'
  'js-yaml@^4.0.0': '>=4.3.2 <5'
  # GHSA-28wg-ghj8-5hjv and GHSA-2v37-7h3g-55p8 — unbounded loops in nanoid's
  # non-secure and custom generators. Every consumer in the tree (postcss,
  # @react-navigation/routers, expo-router) already resolves inside 3.x, so
  # this floor is a patch lift with no API change.
  'nanoid@^3.0.0': '>=3.3.17 <4'

# Advisories that cannot be resolved by raising a floor. Each entry needs a
# reason and an exit condition — an ignore without one silently becomes
# permanent. Prefer an `overrides` floor above whenever a patch exists inside
# the current major.
auditConfig:
  ignoreGhsas:
    # GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq — denial of service via
    # infinite loops in image-size's ICNS, JXL and HEIF parsers. The only
    # consumer is metro@0.83.3's bundler, so these parsers run at build time
    # over images already committed to this repo; the vulnerable code is never
    # shipped to users. The first patched release (2.0.3) is a breaking major
    # that metro's 1.x API does not support, so forcing it would risk mobile
    # bundling to fix a build-time-only issue.
    # Exit: drop both once metro depends on image-size >=2.0.3.
    - 'GHSA-w3rx-r6r6-pgpr'
    - 'GHSA-5p2g-fcmc-qvqq'
